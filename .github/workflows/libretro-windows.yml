name: Play! Libretro Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl -L --silent --output VulkanSDK.exe https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe?Human=true
          cmd.exe /c start /wait .\VulkanSDK.exe in --al --im -c com.lunarg.vulkan.32bit
          echo "VULKAN_SDK=C:\VulkanSDK\1.3.296.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Play! Libretro Core
        shell: cmd
        run: |
          mkdir build && cd build
          
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DUSE_QT=OFF ^
            -DBUILD_LIBRETRO_CORE=ON ^
            -DBUILD_PLAY=OFF
          
          cmake --build . --config Release -j2
          
          echo "=== DLL generated ==="
          dir Source\ui_libretro\Release\play_libretro.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: play-libretro-windows-x64
          path: build/Source/ui_libretro/Release/play_libretro.dll
